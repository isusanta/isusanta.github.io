# Press coverage of research Susanta contributed to.
# Rendered by the "In the Press" block on _pages/about.md. Newest first.
#
#   image    -> thumbnail in images/press/, shown to the LEFT of the text.
#               Pre-rendered at 348x264 (the 116x88 CSS thumb at 3x) so the
#               browser does no cropping of its own.
#   outlet   -> publication name, shown as the small teal label
#   title    -> the article headline
#   date     -> display date
#   url      -> link to the article
#   note     -> optional one-line description of the connection to his work
#   paper    -> optional DOI/arXiv link to the underlying paper, rendered as a
#               "Read the paper" link. Carries the preprint links that used to
#               live as buttons in the old news hero (removed 2026-08-22).
#   quote    -> optional pull-quote text (no surrounding quote marks; the CSS adds them)
#   attrib   -> who said it, required whenever quote is set
#   image_alt-> alt text for that thumbnail. Falls back to the outlet name.
#               Do NOT put double quotes in this value: it is interpolated into
#               an HTML alt="..." attribute and Liquid's {{ }} does not escape,
#               so a raw " ends the attribute and the whole <img> renders as text.
#
# NOTE: Susanta is not named in any of these pieces; they name the PIs and the
# institutions. Keep the wording as "work I contributed to", never "I was featured".

- outlet: "Newsweek"
  image: "newsweek-cover.jpg"
  image_alt: "Newsweek August 2026 cover, Quantum Is Here"
  title: "Quantum Computing's Revolutionary Promise Is Bringing Real-World Solutions"
  date: "August 2026"
  url: "https://www.newsweek.com/nw-ai-technology/quantum-computings-revolutionary-promise-is-bringing-real-world-solutions-12332913"
  note: "Cover feature on quantum computing's first real-world results, covering both the Merz group's protein simulations and the Cleveland Clinic and Oak Ridge fusion molten salt work that I first-authored."
  quote: "We thought we were really going big, but we quickly realized we could have been two or three times larger."
  attrib: "Prof. Kenneth M. Merz Jr., quoted in Newsweek"

- outlet: "IBM Newsroom"
  image: "ibm-flibe-tokamak.jpg"
  image_alt: "Diagram of a tokamak with a molten salt tritium breeding blanket"
  title: "Oak Ridge National Lab, Cleveland Clinic, and IBM achieve first known computations of fusion materials on a quantum computer"
  date: "July 2026"
  url: "https://newsroom.ibm.com/2026-07-06-oak-ridge-national-lab,-cleveland-clinic,-and-ibm-achieve-first-known-computations-of-fusion-materials-on-a-quantum-computer"
  note: "Announcement of the FLiBe molten salt results, on which I am first author."
  paper: "https://doi.org/10.48550/arXiv.2606.30402"

- outlet: "Oak Ridge National Laboratory"
  image: "ornl-genesis-mission.jpg"
  image_alt: "Genesis Mission"
  title: "Oak Ridge National Lab, Cleveland Clinic and IBM achieve first known computations of fusion materials on a quantum computer"
  date: "July 2026"
  url: "https://www.ornl.gov/news/oak-ridge-national-lab-cleveland-clinic-and-ibm-achieve-first-known-computations-fusion"
  note: "ORNL's release on the same collaboration."
  paper: "https://doi.org/10.48550/arXiv.2606.30402"
